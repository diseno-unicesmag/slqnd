<circle cx="1612" cy="429.5" r="3.5" fill="#b88a00"/>
<text x="1626" y="435.5" font-size="18" font-weight="400" fill="#1d1a2b" text-anchor="start">Lo que la RA hace con la metáfora</text>
<circle cx="1612" cy="456.5" r="3.5" fill="#b88a00"/>
<text x="1626" y="462.5" font-size="18" font-weight="400" fill="#1d1a2b" text-anchor="start">No añade: deja ver lo que guardaba</text>
<circle cx="1612" cy="483.5" r="3.5" fill="#b88a00"/>
<text x="1626" y="489.5" font-size="18" font-weight="400" fill="#1d1a2b" text-anchor="start">El lector la activa al apuntar</text>
<path d="M1505 640 C1547.5 640 1547.5 626.5 1590 626.5" fill="none" stroke="#b88a00" stroke-width="3" stroke-linecap="round"/>
<rect x="1590" y="542.5" width="380" height="168" rx="14" fill="#fdf5d6" stroke="#ecc94b" stroke-width="1.5"/>
<text x="1608" y="572.5" font-size="14" font-weight="800" fill="#b88a00" text-anchor="start" letter-spacing="1.6">DE DÓNDE VIENE</text>
<circle cx="1612" cy="596.5" r="3.5" fill="#b88a00"/>
<text x="1626" y="602.5" font-size="18" font-weight="400" fill="#1d1a2b" text-anchor="start">Artivive: la capa oculta en la obra</text>
<circle cx="1612" cy="623.5" r="3.5" fill="#b88a00"/>
<text x="1626" y="629.5" font-size="18" font-weight="400" fill="#1d1a2b" text-anchor="start">Hellblade: el sonido que envuelve</text>
<circle cx="1612" cy="650.5" r="3.5" fill="#b88a00"/>
<text x="1626" y="656.5" font-size="18" font-weight="400" fill="#1d1a2b" text-anchor="start">Bandersnatch: el espectador decide</text>
<circle cx="1612" cy="677.5" r="3.5" fill="#b88a00"/>
<text x="1626" y="683.5" font-size="18" font-weight="400" fill="#1d1a2b" text-anchor="start">Norman: diseño reflexivo</text>
<path d="M1505 640 C1547.5 640 1547.5 820.5 1590 820.5" fill="none" stroke="#b88a00" stroke-width="3" stroke-linecap="round"/>
<rect x="1590" y="736.5" width="380" height="168" rx="14" fill="#fdf5d6" stroke="#ecc94b" stroke-width="1.5"/>
<text x="1608" y="766.5" font-size="14" font-weight="800" fill="#b88a00" text-anchor="start" letter-spacing="1.6">CÓMO SE VE</text>
<circle cx="1612" cy="790.5" r="3.5" fill="#b88a00"/>
<text x="1626" y="796.5" font-size="18" font-weight="400" fill="#1d1a2b" text-anchor="start">Dorado y luz sobre el violeta</text>
<circle cx="1612" cy="817.5" r="3.5" fill="#b88a00"/>
<text x="1626" y="823.5" font-size="18" font-weight="400" fill="#1d1a2b" text-anchor="start">La lente: cristal que enfoca</text>
<circle cx="1612" cy="844.5" r="3.5" fill="#b88a00"/>
<text x="1626" y="850.5" font-size="18" font-weight="400" fill="#1d1a2b" text-anchor="start">Animación y sonido que se despliegan</text>
<circle cx="1612" cy="871.5" r="3.5" fill="#b88a00"/>
<text x="1626" y="877.5" font-size="18" font-weight="400" fill="#1d1a2b" text-anchor="start">El momento de sorpresa</text>
