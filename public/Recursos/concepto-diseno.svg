<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1230" width="2000" height="1230" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Mapa mental del concepto de diseño</title>
<desc id="d">Tres conceptos encadenados, silencio, metáfora y revelación, cada uno con qué es, de dónde viene y cómo se ve.</desc>
<rect width="2000" height="1230" fill="#ffffff"/>
<path d="M810 640 C787.5 640 787.5 640 765 640" fill="none" stroke="#2b1759" stroke-width="7" stroke-linecap="round"/>
