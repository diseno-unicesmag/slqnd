<rect x="30" y="375.5" width="380" height="141" rx="14" fill="#ece6f8" stroke="#b9a8e6" stroke-width="1.5"/>
<text x="48" y="405.5" font-size="14" font-weight="800" fill="#2b1759" text-anchor="start" letter-spacing="1.6">QUÉ ES</text>
<circle cx="52" cy="429.5" r="3.5" fill="#2b1759"/>
<text x="66" y="435.5" font-size="18" font-weight="400" fill="#1d1a2b" text-anchor="start">Lo que existe y se calla</text>
<circle cx="52" cy="456.5" r="3.5" fill="#2b1759"/>
<text x="66" y="462.5" font-size="18" font-weight="400" fill="#1d1a2b" text-anchor="start">No es vacío: es contención</text>
<circle cx="52" cy="483.5" r="3.5" fill="#2b1759"/>
<text x="66" y="489.5" font-size="18" font-weight="400" fill="#1d1a2b" text-anchor="start">«Me aguanto y sigo»</text>
<path d="M495 640 C452.5 640 452.5 626.5 410 626.5" fill="none" stroke="#2b1759" stroke-width="3" stroke-linecap="round"/>
<rect x="30" y="542.5" width="380" height="168" rx="14" fill="#ece6f8" stroke="#b9a8e6" stroke-width="1.5"/>
<text x="48" y="572.5" font-size="14" font-weight="800" fill="#2b1759" text-anchor="start" letter-spacing="1.6">DE DÓNDE VIENE</text>
<circle cx="52" cy="596.5" r="3.5" fill="#2b1759"/>
<text x="66" y="602.5" font-size="18" font-weight="400" fill="#1d1a2b" text-anchor="start">Han: el sujeto que se autoexplota</text>
<circle cx="52" cy="623.5" r="3.5" fill="#2b1759"/>
<text x="66" y="629.5" font-size="18" font-weight="400" fill="#1d1a2b" text-anchor="start">CDPS: 8 de 15 casi nunca lo hablan</text>
<circle cx="52" cy="650.5" r="3.5" fill="#2b1759"/>
<text x="66" y="656.5" font-size="18" font-weight="400" fill="#1d1a2b" text-anchor="start">We Listen: «I’m fine» / «Save me»</text>
<circle cx="52" cy="677.5" r="3.5" fill="#2b1759"/>
<text x="66" y="683.5" font-size="18" font-weight="400" fill="#1d1a2b" text-anchor="start">PostSecret: decir desde el anonimato</text>
<path d="M495 640 C452.5 640 452.5 820.5 410 820.5" fill="none" stroke="#2b1759" stroke-width="3" stroke-linecap="round"/>
<rect x="30" y="736.5" width="380" height="168" rx="14" fill="#ece6f8" stroke="#b9a8e6" stroke-width="1.5"/>
<text x="48" y="766.5" font-size="14" font-weight="800" fill="#2b1759" text-anchor="start" letter-spacing="1.6">CÓMO SE VE</text>
<circle cx="52" cy="790.5" r="3.5" fill="#2b1759"/>
<text x="66" y="796.5" font-size="18" font-weight="400" fill="#1d1a2b" text-anchor="start">Violeta profundo y penumbra</text>
<circle cx="52" cy="817.5" r="3.5" fill="#2b1759"/>
<text x="66" y="823.5" font-size="18" font-weight="400" fill="#1d1a2b" text-anchor="start">Vidrio esmerilado: se intuye, no se ve</text>
<circle cx="52" cy="844.5" r="3.5" fill="#2b1759"/>
<text x="66" y="850.5" font-size="18" font-weight="400" fill="#1d1a2b" text-anchor="start">Neutros oscuros, poco contraste</text>
<circle cx="52" cy="871.5" r="3.5" fill="#2b1759"/>
<text x="66" y="877.5" font-size="18" font-weight="400" fill="#1d1a2b" text-anchor="start">Quietud: nada se mueve todavía</text>
