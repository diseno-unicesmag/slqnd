<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CDPS — Panel del Investigador · Sobre lo que no digo</title>
<link rel="stylesheet" href="../../css/style.css">
<style>
body{padding:32px;min-height:100vh;background-image:radial-gradient(ellipse at 20% 0%,rgba(88,28,135,.22) 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(30,58,138,.18) 0%,transparent 60%);}
h1{font-family:var(--font-display);font-size:1.6rem;font-weight:800;margin-bottom:4px;color:var(--text);}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:28px;}
/* compat aliases */
:root{
  --card: rgba(255,255,255,0.05);
  --r: 16px;
  --dim: rgba(255,255,255,0.55);
  --green: #4caa7c;
  --accent2: #e8b820;
}
.url-box{background:var(--card);border-radius:var(--r);padding:16px 20px;display:inline-flex;align-items:center;gap:12px;margin-bottom:32px;border:1px solid rgba(255,255,255,.06)}
.url-box label{font-size:.75rem;color:var(--dim)}
.url-box code{color:var(--accent);font-size:1rem;user-select:all}
.stats{display:flex;gap:20px;margin-bottom:32px;flex-wrap:wrap}
.stat{background:var(--card);border-radius:var(--r);padding:20px 28px;text-align:center;border:1px solid rgba(255,255,255,.06)}
.stat-n{font-family:'Montserrat',sans-serif;font-size:2.6rem;font-weight:700;color:var(--accent);line-height:1}
.stat-l{font-size:.8rem;color:var(--dim);margin-top:6px}
.section{background:var(--card);border-radius:var(--r);padding:20px;margin-bottom:20px;border:1px solid rgba(255,255,255,.06)}
.section h2{font-size:.85rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px}
.q-list{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto}
.q-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;cursor:pointer;transition:background .2s;font-size:.9rem}
.q-item:hover{background:rgba(255,255,255,.05)}
.q-item.active{background:rgba(45,212,191,.08);border:1px solid rgba(45,212,191,.4)}
.q-num{color:var(--dim);font-size:.75rem;min-width:28px}
.q-bloque{font-size:.7rem;color:var(--accent);background:rgba(45,212,191,.1);padding:2px 8px;border-radius:20px;margin-left:auto;white-space:nowrap;font-weight:600}
.btn{font-family:'Inter',sans-serif;font-size:.95rem;font-weight:600;border:none;border-radius:40px;padding:13px 32px;cursor:pointer;transition:all .3s}
.btn-primary{background:var(--accent);color:#060c12;font-family:'Montserrat',sans-serif}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(45,212,191,.35)}
.btn-primary:disabled{opacity:.25;cursor:not-allowed;transform:none;box-shadow:none}
.btn-ghost{background:transparent;color:var(--dim);border:1.5px solid rgba(255,255,255,.1)}
.btn-ghost:hover{border-color:rgba(255,255,255,.3);color:var(--text)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.status{font-size:.9rem;color:var(--dim);margin-bottom:16px}
.status.ok{color:var(--green)}
.live-counts{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto}
.lc-row{display:flex;align-items:center;gap:10px;font-size:.85rem}
.lc-label{min-width:180px;color:var(--dim);text-align:right}
.lc-bar{flex:1;height:22px;background:rgba(255,255,255,.04);border-radius:6px;overflow:hidden}
.lc-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px;transition:width .5s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;min-width:24px}
.lc-n{font-size:.7rem;font-weight:700;color:#08080e}
.log{font-size:.8rem;color:var(--dim);max-height:160px;overflow-y:auto;font-family:'Inter',sans-serif}
.log-e{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.log-e .t{color:var(--accent);margin-right:8px}
</style>
</head>
<body>
<h1>Panel del investigador</h1>
<p class="sub">Cartografía Digital de Percepción Silenciosa — <em>Sobre lo que no digo</em></p>

<div class="url-box">
  <div>
    <label>URL para los jugadores</label><br>
    <code id="game-url">cargando...</code>
  </div>
</div>

<div class="stats">
  <div class="stat"><div class="stat-n" id="s-players">0</div><div class="stat-l">Jugadores conectados</div></div>
  <div class="stat"><div class="stat-n" id="s-q">—</div><div class="stat-l">Pregunta activa</div></div>
</div>

<div class="actions">
  <div style="display:flex;gap:12px">
    <button class="btn btn-ghost" id="btn-prev" onclick="doPrev()" disabled>< Anterior</button>
    <button class="btn btn-primary" id="btn-reveal" onclick="doRevealQuestion()" disabled>👁️ Revelar Pregunta</button>
    <button class="btn btn-primary" id="btn-next" onclick="doNext()">Siguiente ></button>
  </div>
  <button class="btn btn-ghost" onclick="doReset()">↺ Reiniciar sesión</button>
</div>

<div class="status" id="status-txt">Esperando jugadores...</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
  <!-- Question list -->
  <div class="section">
    <h2>Preguntas</h2>
    <div class="q-list" id="q-list"></div>
  </div>

  <!-- Live room counts -->
  <div class="section">
    <h2>Conteo en tiempo real</h2>
    <div class="live-counts" id="live-counts"><div style="color:var(--dim);font-size:.85rem">Activa una pregunta para ver el conteo</div></div>
  </div>
</div>

<div class="section" style="margin-top:20px">
  <h2>Registro de actividad</h2>
  <div class="log" id="log"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/preguntas.js"></script>
<script>
const socket = io();
let currentQ = null;
let playerCount = 0;
let lastCounts = {};
let currentRevealed = false;

document.getElementById('game-url').textContent = window.location.origin;

// Build question list
const qList = document.getElementById('q-list');
PREGUNTAS.forEach((q, i) => {
  const el = document.createElement('div');
  el.className = 'q-item';
  el.id = `qi-${i}`;
  el.onclick = () => { setQ(i); };
  el.innerHTML = `
    <div class="qi-tag">${q.bloque}</div>
    <div class="qi-text"><strong>${q.texto_jovial || q.texto}</strong></div>
    <div class="qi-text" style="font-size:0.8rem;color:var(--dim);margin-top:2px;font-style:italic">${q.texto}</div>
  `;
  qList.appendChild(el);
});

function setQ(idx) {
  currentQ = idx;
  socket.emit('set-question', idx);
  document.querySelectorAll('.q-item').forEach(el => el.classList.remove('active'));
  document.getElementById(`qi-${idx}`)?.classList.add('active');
  document.getElementById(`qi-${idx}`)?.scrollIntoView({behavior:'smooth',block:'nearest'});
  document.getElementById('s-q').textContent = idx+1;
  document.getElementById('status-txt').textContent = `Pregunta ${idx+1} activa: ${PREGUNTAS[idx].texto.substring(0,60)}...`;
  lastCounts = {};
  renderLiveCounts({});
  log(`Pregunta ${idx+1} activada`);
}

function doNext() {
  if (currentQ === null) currentQ = 0;
  else if (currentQ < PREGUNTAS.length - 1) currentQ++;
  socket.emit('set-question', currentQ);
}
function doPrev() {
  if (currentQ > 0) {
    currentQ--;
    socket.emit('set-question', currentQ);
  }
}
function doRevealQuestion() {
  socket.emit('reveal-question');
}

function doReset() {
  if (!confirm('¿Reiniciar la sesión? Los datos se borrarán para todos.')) return;
  socket.emit('reset');
  currentQ = null;
  document.getElementById('s-q').textContent = '—';
  document.querySelectorAll('.q-item').forEach(el => el.classList.remove('active'));
  renderLiveCounts({});
  log('Sesión reiniciada');
}

socket.on('player-count', ({total, connected}) => {
  playerCount = total;
  document.getElementById('s-players').textContent = connected + ' / ' + total;
  updateButtons();
});

socket.on('session-state', ({question, questionRevealed, playerCount: pc}) => {
  document.getElementById('s-players').textContent = pc.connected + ' / ' + pc.total;
  playerCount = pc.total;
  if (question !== null && currentQ === null) {
    currentQ = question;
    currentRevealed = questionRevealed;
    updatePanelState(question, questionRevealed);
    log(`Panel restaurado → pregunta ${question+1}`);
  }
});

socket.on('question-changed', idx => {
  currentQ = idx;
  currentRevealed = false;
  updatePanelState(idx, false);
});

socket.on('question-revealed', () => {
  currentRevealed = true;
  updatePanelState(currentQ, true);
});

function updatePanelState(idx, revealed) {
  document.getElementById('s-q').textContent = idx + 1;
  document.querySelectorAll('.q-item').forEach(el => el.classList.remove('active'));
  document.getElementById(`qi-${idx}`)?.classList.add('active');
  document.getElementById(`qi-${idx}`)?.scrollIntoView({behavior:'smooth', block:'nearest'});
  // Logic for buttons
  const q = PREGUNTAS[idx];
  
  document.getElementById('status-txt').textContent =
    `Pregunta ${idx+1} activa: ${(q.texto_jovial || q.texto).substring(0,60)}...`;
  
  const isPrivate = q.tipo === 'texto';
  
  document.getElementById('btn-prev').disabled = idx === 0;
  
  if (isPrivate) {
    // Text questions don't have reveal
    document.getElementById('btn-reveal').style.display = 'none';
    document.getElementById('btn-next').disabled = false;
  } else {
    document.getElementById('btn-reveal').style.display = 'block';
    document.getElementById('btn-reveal').disabled = revealed || playerCount === 0;
    // Next is locked until revealed, unless it's the very first time starting the game
    document.getElementById('btn-next').disabled = !revealed && idx !== null;
  }
  
  renderLiveCounts(lastCounts);
}

function updateButtons() {
  if (currentQ !== null) updatePanelState(currentQ, currentRevealed);
}

socket.on('room-counts', counts => {
  lastCounts = counts;
  renderLiveCounts(counts);
});

function renderLiveCounts(counts) {
  const q = currentQ !== null ? PREGUNTAS[currentQ] : null;
  const lc = document.getElementById('live-counts');
  if (!q || !q.opciones) { lc.innerHTML = '<div style="color:var(--dim);font-size:.85rem">Esperando respuestas...</div>'; return; }
  const maxC = Math.max(...q.opciones.map(o => counts[o.id]||0), 1);
  lc.innerHTML = q.opciones.map(opt => {
    const c = counts[opt.id] || 0;
    const isWinner = c > 0 && c === maxC && document.getElementById('btn-next').disabled === false; // Highlight winner after reveal
    const pct = (c/maxC)*100;
    const highlight = isWinner ? 'box-shadow: 0 0 10px var(--accent); border: 1px solid var(--accent);' : '';
    return `<div class="lc-row" style="${highlight} padding: 4px; border-radius: 6px;">
      <span class="lc-label">${opt.emoji} ${opt.label}</span>
      <div class="lc-bar"><div class="lc-fill" style="width:${pct}%"><span class="lc-n">${c}</span></div></div>
    </div>`;
  }).join('');
}

function log(msg) {
  const el = document.getElementById('log');
  const t = new Date().toLocaleTimeString('es-CO');
  el.innerHTML = `<div class="log-e"><span class="t">${t}</span>${msg}</div>` + el.innerHTML;
}

log('Panel iniciado');
</script>
</body>
</html>
